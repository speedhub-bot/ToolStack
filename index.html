<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolStack — Student Utility Hub</title>
    <meta name="description" content="A futuristic, premium student utility hub with 30 fully functional tools. Free, fast, and no login required.">
    <meta property="og:title" content="ToolStack — Student Utility Hub">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
:root {
    --bg: #0a0a0f;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --primary: #8b5cf6;
    --secondary: #06b6d4;
    --card-bg: rgba(255, 255, 255, 0.04);
    --card-border: rgba(255, 255, 255, 0.08);
    --glass-bg: rgba(10, 10, 15, 0.7);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    line-height: 1.5;
}
.bg-orbs {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: -2; overflow: hidden; pointer-events: none;
}
.orb {
    position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.4;
    animation: float 20s infinite ease-in-out alternate;
}
.orb-1 { width: 400px; height: 400px; background: var(--primary); top: -100px; left: -100px; }
.orb-2 { width: 500px; height: 500px; background: var(--secondary); bottom: -200px; right: -100px; animation-delay: -5s; }
.orb-3 { width: 300px; height: 300px; background: #3b82f6; top: 40%; left: 40%; animation-delay: -10s; }
@keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.1); } }
.bg-grid {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: -1; pointer-events: none; opacity: 0.15;
    background-image: radial-gradient(rgba(255,255,255,0.2) 1px, transparent 1px);
    background-size: 24px 24px;
}
.cursor-glow {
    position: fixed; width: 400px; height: 400px; background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, transparent 70%);
    border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%);
    transition: width 0.2s, height 0.2s; mix-blend-mode: screen;
}
nav {
    position: fixed; top: 0; width: 100%; padding: 20px 40px; display: flex; justify-content: space-between;
    align-items: center; z-index: 100; transition: all 0.3s;
}
nav.scrolled { background: var(--glass-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--card-border); padding: 15px 40px; }
.logo { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; cursor: pointer; perspective: 1000px; z-index: 101; transform-style: preserve-3d; }
.logo-icon { display: inline-block; transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); filter: drop-shadow(0 0 8px rgba(139,92,246,0.8)); }
.logo:hover .logo-icon { transform: rotate(15deg) scale(1.2); }
.logo-text { background: linear-gradient(to right, #f1f5f9, #8b5cf6, #06b6d4, #f1f5f9); background-size: 300% auto; color: transparent; -webkit-background-clip: text; background-clip: text; animation: shine 4s linear infinite; }
@keyframes shine { to { background-position: 300% center; } }
.tagline { color: var(--text-muted); font-size: 0.9rem; }
.hero { padding: 150px 20px 80px; text-align: center; max-width: 800px; margin: 0 auto; }
.hero-title { font-size: 4rem; font-weight: 800; margin-bottom: 16px; letter-spacing: -1.5px; display: flex; justify-content: center; flex-wrap: wrap; }
.hero-title span { opacity: 0; transform: translateY(20px); animation: reveal 0.5s forwards; }
@keyframes reveal { to { opacity: 1; transform: translateY(0); } }
.hero-subtitle { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 40px; }
.search-container { position: relative; max-width: 500px; margin: 0 auto 30px; }
.search-input {
    width: 100%; padding: 16px 24px; border-radius: 30px; background: var(--card-bg); border: 1px solid var(--card-border);
    color: var(--text); font-size: 1.1rem; outline: none; transition: all 0.3s; font-family: 'Inter', sans-serif;
}
.search-input:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(139,92,246,0.2); }
.filters { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.filter-btn {
    background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); padding: 8px 16px;
    border-radius: 20px; cursor: pointer; transition: all 0.3s; font-family: 'Inter', sans-serif; font-size: 0.9rem;
}
.filter-btn.active { border-color: var(--primary); box-shadow: 0 0 15px rgba(139,92,246,0.3); color: #fff; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 20px 100px; }
.tools-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
@media (max-width: 1024px) { .tools-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .tools-grid { grid-template-columns: 1fr; } }
.tool-card {
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 24px;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; display: flex; flex-direction: column;
    opacity: 0; transform: translateY(30px); animation: slideUpFade 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
@keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }
.tool-card:hover { transform: translateY(-10px) scale(1.02); border-color: var(--primary); box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 25px rgba(139,92,246,0.3); z-index: 10; }
.tool-icon { font-size: 2rem; margin-bottom: 16px; }
.tool-name { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
.tool-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; flex-grow: 1; }
.tool-btn {
    background: transparent; border: 1px solid var(--card-border); color: var(--text); padding: 10px;
    border-radius: 8px; cursor: pointer; transition: all 0.3s; font-family: 'Inter', sans-serif; font-weight: 500;
    position: relative; overflow: hidden; margin-top: auto;
}
.tool-btn::before {
    content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); transition: left 0.5s;
}
.tool-btn:hover { background: rgba(255,255,255,0.05); transform: scale(1.02); }
.tool-btn:hover::before { left: 100%; }
.badge-new {
    position: absolute; top: 16px; right: 16px; background: linear-gradient(45deg, var(--primary), var(--secondary));
    font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; font-weight: bold; letter-spacing: 1px;
}
.modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6);
    backdrop-filter: blur(5px); z-index: 1000; display: none; justify-content: center; align-items: center;
    opacity: 0; transition: opacity 0.3s;
}
.modal-overlay.active { display: flex; opacity: 1; }
.modal-content {
    background: #12121a; border: 1px solid var(--card-border); border-radius: 20px; width: 90%; max-width: 600px;
    max-height: 90vh; overflow-y: auto; padding: 30px; position: relative;
    transform: scale(0.95); transition: transform 0.3s; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}
.modal-overlay.active .modal-content { transform: scale(1); }
.modal-close {
    position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: var(--text-muted);
    font-size: 1.5rem; cursor: pointer; transition: color 0.3s;
}
.modal-close:hover { color: var(--text); }
.modal-title { font-size: 1.8rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
.input-group { margin-bottom: 20px; position: relative; }
.input-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem; transition: all 0.3s; }
.input-group input, .input-group select, .input-group textarea {
    width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.2); border: 1px solid var(--card-border);
    border-radius: 8px; color: var(--text); font-family: 'Inter', sans-serif; outline: none; transition: all 0.3s;
}
.input-group input:focus, .input-group select:focus, .input-group textarea:focus {
    border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary);
}
.calc-btn {
    width: 100%; background: linear-gradient(45deg, var(--primary), var(--secondary)); color: #fff; border: none; padding: 14px; border-radius: 8px;
    font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); margin-top: 10px;
    background-size: 200% auto;
}
.calc-btn:hover { background-position: right center; transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 25px rgba(139,92,246,0.5); }
.calc-btn:active { transform: translateY(1px) scale(0.98); }
.result-box {
    margin-top: 24px; padding: 20px; background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.3);
    border-radius: 12px; display: none; flex-direction: column; align-items: center; text-align: center;
}
.result-box.active { display: flex; animation: slideUpFade 0.4s forwards; }
.result-value { font-size: 2.5rem; font-weight: 700; color: var(--secondary); margin: 10px 0; font-variant-numeric: tabular-nums; word-break: break-all; }
.result-extra { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 10px; }
.copy-btn {
    background: transparent; border: 1px solid var(--secondary); color: var(--secondary); padding: 6px 12px;
    border-radius: 6px; cursor: pointer; font-size: 0.8rem; transition: all 0.3s; margin-top: 10px;
}
.copy-btn:hover { background: var(--secondary); color: #000; }
.toast-container { position: fixed; bottom: 20px; left: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
.toast {
    background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--card-border);
    padding: 12px 20px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    transform: translateX(-120%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.toast.show { transform: translateX(0); }
.back-to-top {
    position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px; border-radius: 50%;
    background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text);
    display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 100;
    opacity: 0; pointer-events: none; transition: all 0.3s; backdrop-filter: blur(5px);
}
.back-to-top.visible { opacity: 1; pointer-events: auto; }
.back-to-top:hover { background: var(--primary); border-color: var(--primary); transform: translateY(-5px); }
footer { text-align: center; padding: 40px; color: var(--text-muted); font-size: 0.9rem; border-top: 1px solid var(--card-border); }
.pomodoro-circle { width: 200px; height: 200px; border-radius: 50%; border: 8px solid var(--card-border); display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; font-size: 3rem; font-weight: 700; position: relative; transition: all 0.3s; }
.pomodoro-circle.active { border-color: var(--primary); box-shadow: 0 0 30px rgba(139,92,246,0.3); }
.color-preview { width: 100%; height: 100px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--card-border); transition: background 0.3s; }
.flex-row { display: flex; gap: 10px; }
.flex-row > * { flex: 1; }
.no-results { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted); font-size: 1.2rem; }

    </style>
</head>
<body>
<div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>
<div class="bg-grid"></div>
<div class="cursor-glow" id="cursorGlow"></div>

<nav id="navbar">
    <div class="logo" id="mainLogo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">ToolStack</span>
    </div>
    <div class="tagline">Every tool a student needs.</div>
</nav>

<header class="hero">
    <h1 class="hero-title" id="heroTitle">ToolStack</h1>
    <p class="hero-subtitle">Free. Fast. No login required.</p>
    <div class="search-container">
        <input type="text" class="search-input" id="searchInput" placeholder="Search for a tool...">
    </div>
    <div class="filters" id="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="academic">📚 Academic</button>
        <button class="filter-btn" data-filter="math">🔢 Math & Numbers</button>
        <button class="filter-btn" data-filter="productivity">⏱️ Productivity</button>
        <button class="filter-btn" data-filter="tech">💻 Developer / Tech</button>
        <button class="filter-btn" data-filter="finance">💰 Finance</button>
        <button class="filter-btn" data-filter="health">🧬 Health & General</button>
    </div>
</header>

<main class="container">
    <div class="tools-grid" id="toolsGrid">
        <!-- Cards injected by JS -->
    </div>
</main>

<footer>
    <p>Made with ❤️ by Akash. Free forever.</p>
</footer>

<button class="back-to-top" id="backToTop">↑</button>
<div class="toast-container" id="toastContainer"></div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-content" id="modalContent">
        <button class="modal-close" id="modalClose">×</button>
        <div class="modal-title" id="modalTitle"></div>
        <div id="modalBody"></div>
        <div class="result-box" id="resultBox">
            <div class="result-extra" id="resultExtra"></div>
            <div class="result-value" id="resultValue"></div>
            <button class="copy-btn" id="copyResultBtn">Copy Result</button>
        </div>
    </div>
</div>

    <script>
// UI Logic
const tools = []; // Will be populated by parts

// Cursor
const cursor = document.getElementById('cursorGlow');
document.addEventListener('mousemove', (e) => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
});

// Logo Magnetic Effect
const mainLogo = document.getElementById('mainLogo');
if (mainLogo) {
    mainLogo.addEventListener('mousemove', (e) => {
        const rect = mainLogo.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        mainLogo.style.transform = `translate(${x * 0.15}px, ${y * 0.15}px) rotateX(${-y * 0.5}deg) rotateY(${x * 0.5}deg) scale(1.05)`;
    });
    mainLogo.addEventListener('mouseleave', () => {
        mainLogo.style.transform = `translate(0px, 0px) rotateX(0deg) rotateY(0deg) scale(1)`;
        mainLogo.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
    });
    mainLogo.addEventListener('mouseenter', () => {
        mainLogo.style.transition = 'none';
    });
}

// Navbar & Back to top
const navbar = document.getElementById('navbar');
const backToTop = document.getElementById('backToTop');
window.addEventListener('scroll', () => {
    if (window.scrollY > 50) navbar.classList.add('scrolled');
    else navbar.classList.remove('scrolled');
    
    if (window.scrollY > 300) backToTop.classList.add('visible');
    else backToTop.classList.remove('visible');
});
backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

// Hero Title Animation
const title = document.getElementById('heroTitle');
const text = title.innerText;
title.innerHTML = '';
text.split('').forEach((char, i) => {
    const span = document.createElement('span');
    span.innerText = char === ' ' ? '\u00A0' : char;
    span.style.animationDelay = (i * 0.05) + 's';
    title.appendChild(span);
});

// Toast
function showToast(msg) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerText = msg;
    container.appendChild(toast);
    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
    }, 2000);
}

// Modal
const modalOverlay = document.getElementById('modalOverlay');
const modalClose = document.getElementById('modalClose');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');
const resultBox = document.getElementById('resultBox');
const resultValue = document.getElementById('resultValue');
const resultExtra = document.getElementById('resultExtra');
const copyBtn = document.getElementById('copyResultBtn');
let currentTool = null;

function openModal(toolId) {
    const tool = tools.find(t => t.id === toolId);
    if (!tool) return;
    currentTool = tool;
    modalTitle.innerHTML = `<span class="tool-icon">${tool.icon}</span> ${tool.name}`;
    modalBody.innerHTML = tool.renderForm();
    resultBox.classList.remove('active');
    
    const calcBtn = document.createElement('button');
    calcBtn.className = 'calc-btn';
    calcBtn.innerText = 'Calculate';
    calcBtn.onclick = () => {
        try {
            const res = tool.calculate();
            if (res) {
                resultExtra.innerText = res.label || '';
                animateValue(resultValue, 0, res.value, 1000, res.isString);
                resultBox.classList.add('active');
            }
        } catch (e) {
            showToast(e.message || 'Error in calculation');
        }
    };
    modalBody.appendChild(calcBtn);
    
    // Add custom listeners if any
    if(tool.onLoad) tool.onLoad();

    modalOverlay.classList.add('active');
}

modalClose.onclick = () => {
    modalOverlay.classList.remove('active');
    if(currentTool && currentTool.onClose) currentTool.onClose();
};
modalOverlay.onclick = (e) => {
    if (e.target === modalOverlay) {
        modalOverlay.classList.remove('active');
        if(currentTool && currentTool.onClose) currentTool.onClose();
    }
};

copyBtn.onclick = () => {
    navigator.clipboard.writeText(resultValue.innerText);
    showToast('Result copied!');
};

// Animate Value
function animateValue(obj, start, end, duration, isString) {
    if (isString) {
        obj.innerHTML = end;
        return;
    }
    let startTimestamp = null;
    const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        const current = progress * (end - start) + start;
        obj.innerHTML = Number.isInteger(end) ? Math.floor(current) : current.toFixed(2);
        if (1 > progress) {
            window.requestAnimationFrame(step);
        } else {
            obj.innerHTML = end;
        }
    };
    window.requestAnimationFrame(step);
}

// Render Grid
const grid = document.getElementById('toolsGrid');
function renderGrid(filterText = '', category = 'all') {
    grid.innerHTML = '';
    let count = 0;
    tools.forEach((tool, i) => {
        if (category !== 'all' && tool.category !== category) return;
        if (filterText && !tool.name.toLowerCase().includes(filterText.toLowerCase()) && !tool.desc.toLowerCase().includes(filterText.toLowerCase())) return;
        
        count++;
        const card = document.createElement('div');
        card.className = 'tool-card';
        card.style.animationDelay = (i * 0.05) + 's';
        card.innerHTML = `
            ${tool.isNew ? '<div class="badge-new">NEW</div>' : ''}
            <div class="tool-icon">${tool.icon}</div>
            <div class="tool-name">${tool.name}</div>
            <div class="tool-desc">${tool.desc}</div>
            <button class="tool-btn" onclick="openModal('${tool.id}')">Open Tool →</button>
        `;
        grid.appendChild(card);
    });
    if (count === 0) {
        grid.innerHTML = '<div class="no-results">No tool found — suggest one?</div>';
    }
}

// Search & Filter
const searchInput = document.getElementById('searchInput');
const filterBtns = document.querySelectorAll('.filter-btn');
let currentCategory = 'all';

searchInput.addEventListener('input', (e) => renderGrid(e.target.value, currentCategory));

filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.filter;
        renderGrid(searchInput.value, currentCategory);
    });
});

// Favicon Trick
const canvas = document.createElement('canvas');
canvas.height = 64;
canvas.width = 64;
const ctx = canvas.getContext('2d');
ctx.font = '48px serif';
ctx.fillText('⚡', 8, 48);
const link = document.createElement('link');
link.rel = 'icon';
link.href = canvas.toDataURL();
document.head.appendChild(link);

// Global functions for tools
window.addSubject = function() {
    const div = document.createElement('div');
    div.className = 'flex-row mb-2';
    div.innerHTML = '<div class="input-group"><input type="number" placeholder="Credits" class="cgpa_c"></div><div class="input-group"><input type="number" placeholder="Grade Point" class="cgpa_g"></div>';
    document.getElementById('cgpa_subjects').appendChild(div);
};

window.addSem = function() {
    const div = document.createElement('div');
    div.className = 'flex-row mb-2';
    div.innerHTML = '<div class="input-group"><input type="number" placeholder="Sem Credits" class="sgpa_c"></div><div class="input-group"><input type="number" placeholder="SGPA" class="sgpa_g"></div>';
    document.getElementById('sgpa_list').appendChild(div);
};

window.pomoInt = null;
window.startPomo = function() {
    let t = 25 * 60;
    clearInterval(window.pomoInt);
    window.pomoInt = setInterval(() => {
        t--;
        const m = Math.floor(t/60).toString().padStart(2,'0');
        const s = (t%60).toString().padStart(2,'0');
        document.getElementById('pomo_display').innerText = m+':'+s;
        if(t<=0) { clearInterval(window.pomoInt); alert('Time up!'); }
    }, 1000);
};
window.stopPomo = function() { clearInterval(window.pomoInt); };

tools.push(
    {
        id: 'cgpa', name: 'CGPA Calculator', icon: '🎓', category: 'academic', desc: 'Calculate CGPA based on credits and grades.',
        renderForm: () => `
            <div class="input-group">
                <label>University Scale</label>
                <select id="cgpa_scale"><option value="10">10 Point Scale</option><option value="4">4.0 Scale</option></select>
            </div>
            <div id="cgpa_subjects">
                <div class="flex-row mb-2">
                    <div class="input-group"><input type="number" placeholder="Credits" class="cgpa_c"></div>
                    <div class="input-group"><input type="number" placeholder="Grade Point" class="cgpa_g"></div>
                </div>
            </div>
            <button class="tool-btn" onclick="addSubject()" style="width:100%; margin-bottom:15px;">+ Add Subject</button>
            
        `,
        calculate: () => {
            const credits = Array.from(document.querySelectorAll('.cgpa_c')).map(i => parseFloat(i.value) || 0);
            const grades = Array.from(document.querySelectorAll('.cgpa_g')).map(i => parseFloat(i.value) || 0);
            let totalC = 0, totalG = 0;
            credits.forEach((c, i) => { totalC += c; totalG += c * grades[i]; });
            if(totalC === 0) throw new Error("Enter credits");
            const cgpa = totalG / totalC;

        calculate: () => {

                let num = parseInt(v);
                const lookup = {M:1000,CM:900,D:500,CD:400,C:100,XC:90,L:50,XL:40,X:10,IX:9,V:5,IV:4,I:1};
                let roman = '';

                }

            } else {
                const romanToInt = {I:1,V:5,X:10,L:50,C:100,D:500,M:1000};
                let num = 0;
                for(let i=0; v.length>i; i++) {
                    const cur = romanToInt[v[i]], next = romanToInt[v[i+1]];

                    else num += cur;
                }
                return { value: num, label: 'Integer Value', isString: false };
            }
        }

            const act = parseFloat(document.getElementById('td_act').value);
            const bmr = 10 * w + 6.25 * h - 5 * a + 5; // simplified male
            return { value: bmr * act, label: 'Calories/Day', isString: false };
        }
    },
    {
        id: 'sleep', name: 'Sleep Cycle', icon: '🌙', category: 'health', desc: 'When to wake up.', isNew: true,
        renderForm: () => `
            <div class="input-group"><label>I want to wake up at</label><input type="time" id="sl_time"></div>
        `,
        calculate: () => {
            const t = document.getElementById('sl_time').value;
            if(!t) throw new Error("Select time");
            const [h, m] = t.split(':');
            let d = new Date(); d.setHours(h); d.setMinutes(m);
            // 90 min cycles, 15 min fall asleep
            let res = [];
            for(let i=6; i>=3; i--) {
                let w = new Date(d.getTime() - (i*90 + 15)*60000);
                res.push(w.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
            }
            return { value: res.join(' OR '), label: 'Go to bed at', isString: true };
        }
    },
    {
        id: 'otp', name: 'OTP Generator', icon: '📱', category: 'health', desc: 'Random numeric OTP.',
        renderForm: () => `
            <div class="input-group"><label>Length</label><input type="number" id="otp_len" value="6"></div>
        `,
        calculate: () => {
            const l = parseInt(document.getElementById('otp_len').value);
            let otp = '';
            for(let i=0; l>i; i++) otp += Math.floor(Math.random() * 10);
            return { value: otp, label: 'Your OTP', isString: true };
        }
    }
);

renderGrid();
    </script>
</body>
</html>
