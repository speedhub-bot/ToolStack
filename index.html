<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolStack — Student Utility Hub</title>
    <meta name="description" content="A futuristic, premium student utility hub with 30 fully functional tools. Free, fast, and no login required.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>:root {
    --bg: #0a0a0f;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --primary: #8b5cf6;
    --secondary: #06b6d4;
    --card-bg: rgba(255, 255, 255, 0.04);
    --card-border: rgba(255, 255, 255, 0.08);
    --glass-bg: rgba(10, 10, 15, 0.7);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    line-height: 1.5;
}
.bg-orbs {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: -2; overflow: hidden; pointer-events: none;
}
.orb {
    position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.4;
    animation: float 20s infinite ease-in-out alternate;
}
.orb-1 { width: 400px; height: 400px; background: var(--primary); top: -100px; left: -100px; }
.orb-2 { width: 500px; height: 500px; background: var(--secondary); bottom: -200px; right: -100px; animation-delay: -5s; }
.orb-3 { width: 300px; height: 300px; background: #3b82f6; top: 40%; left: 40%; animation-delay: -10s; }
@keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.1); } }
.bg-grid {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: -1; pointer-events: none; opacity: 0.15;
    background-image: radial-gradient(rgba(255,255,255,0.2) 1px, transparent 1px);
    background-size: 24px 24px;
}
.cursor-glow {
    position: fixed; width: 400px; height: 400px; background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, transparent 70%);
    border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%);
    transition: width 0.2s, height 0.2s; mix-blend-mode: screen;
}
nav {
    position: fixed; top: 0; width: 100%; padding: 20px 40px; display: flex; justify-content: space-between;
    align-items: center; z-index: 100; transition: all 0.3s;
}
nav.scrolled { background: var(--glass-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--card-border); padding: 15px 40px; }
.logo { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; cursor: pointer; perspective: 1000px; z-index: 101; transform-style: preserve-3d; }
.logo-icon { display: inline-block; transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); filter: drop-shadow(0 0 8px rgba(139,92,246,0.8)); }
.logo:hover .logo-icon { transform: rotate(15deg) scale(1.2); }
.logo-text { background: linear-gradient(to right, #f1f5f9, #8b5cf6, #06b6d4, #f1f5f9); background-size: 300% auto; color: transparent; -webkit-background-clip: text; background-clip: text; animation: shine 4s linear infinite; }
@keyframes shine { to { background-position: 300% center; } }
.tagline { color: var(--text-muted); font-size: 0.9rem; }
.hero { padding: 150px 20px 80px; text-align: center; max-width: 800px; margin: 0 auto; }
.hero-title { font-size: 4rem; font-weight: 800; margin-bottom: 16px; letter-spacing: -1.5px; display: flex; justify-content: center; flex-wrap: wrap; }
.hero-title span { opacity: 0; transform: translateY(20px); animation: reveal 0.5s forwards; }
@keyframes reveal { to { opacity: 1; transform: translateY(0); } }
.hero-subtitle { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 40px; }
.search-container { position: relative; max-width: 500px; margin: 0 auto 30px; }
.search-input {
    width: 100%; padding: 16px 24px; border-radius: 30px; background: var(--card-bg); border: 1px solid var(--card-border);
    color: var(--text); font-size: 1.1rem; outline: none; transition: all 0.3s; font-family: 'Inter', sans-serif;
}
.search-input:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(139,92,246,0.2); }
.filters { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.filter-btn {
    background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); padding: 8px 16px;
    border-radius: 20px; cursor: pointer; transition: all 0.3s; font-family: 'Inter', sans-serif; font-size: 0.9rem;
}
.filter-btn.active { border-color: var(--primary); box-shadow: 0 0 15px rgba(139,92,246,0.3); color: #fff; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 20px 100px; }
.tools-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
@media (max-width: 1024px) { .tools-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .tools-grid { grid-template-columns: 1fr; } }
.tool-card {
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 24px;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; display: flex; flex-direction: column;
    opacity: 0; transform: translateY(30px); animation: slideUpFade 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
@keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }
.tool-card:hover { transform: translateY(-10px) scale(1.02); border-color: var(--primary); box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 25px rgba(139,92,246,0.3); z-index: 10; }
.tool-icon { font-size: 2rem; margin-bottom: 16px; }
.tool-name { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
.tool-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; flex-grow: 1; }
.tool-btn {
    background: transparent; border: 1px solid var(--card-border); color: var(--text); padding: 10px;
    border-radius: 8px; cursor: pointer; transition: all 0.3s; font-family: 'Inter', sans-serif; font-weight: 500;
    position: relative; overflow: hidden; margin-top: auto;
}
.tool-btn::before {
    content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); transition: left 0.5s;
}
.tool-btn:hover { background: rgba(255,255,255,0.05); transform: scale(1.02); }
.tool-btn:hover::before { left: 100%; }
.badge-new {
    position: absolute; top: 16px; right: 16px; background: linear-gradient(45deg, var(--primary), var(--secondary));
    font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; font-weight: bold; letter-spacing: 1px;
}
.modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6);
    backdrop-filter: blur(5px); z-index: 1000; display: none; justify-content: center; align-items: center;
    opacity: 0; transition: opacity 0.3s;
}
.modal-overlay.active { display: flex; opacity: 1; }
.modal-content {
    background: #12121a; border: 1px solid var(--card-border); border-radius: 20px; width: 90%; max-width: 600px;
    max-height: 90vh; overflow-y: auto; padding: 30px; position: relative;
    transform: scale(0.95); transition: transform 0.3s; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}
.modal-overlay.active .modal-content { transform: scale(1); }
.modal-close {
    position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: var(--text-muted);
    font-size: 1.5rem; cursor: pointer; transition: color 0.3s;
}
.modal-close:hover { color: var(--text); }
.modal-title { font-size: 1.8rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
.input-group { margin-bottom: 20px; position: relative; }
.input-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem; transition: all 0.3s; }
.input-group input, .input-group select, .input-group textarea {
    width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.2); border: 1px solid var(--card-border);
    border-radius: 8px; color: var(--text); font-family: 'Inter', sans-serif; outline: none; transition: all 0.3s;
}
.input-group input:focus, .input-group select:focus, .input-group textarea:focus {
    border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary);
}
.calc-btn {
    width: 100%; background: linear-gradient(45deg, var(--primary), var(--secondary)); color: #fff; border: none; padding: 14px; border-radius: 8px;
    font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); margin-top: 10px;
    background-size: 200% auto;
}
.calc-btn:hover { background-position: right center; transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 25px rgba(139,92,246,0.5); }
.calc-btn:active { transform: translateY(1px) scale(0.98); }
.result-box {
    margin-top: 24px; padding: 20px; background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.3);
    border-radius: 12px; display: none; flex-direction: column; align-items: center; text-align: center;
}
.result-box.active { display: flex; animation: slideUpFade 0.4s forwards; }
.result-value { font-size: 2.5rem; font-weight: 700; color: var(--secondary); margin: 10px 0; font-variant-numeric: tabular-nums; word-break: break-all; }
.result-extra { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 10px; }
.copy-btn {
    background: transparent; border: 1px solid var(--secondary); color: var(--secondary); padding: 6px 12px;
    border-radius: 6px; cursor: pointer; font-size: 0.8rem; transition: all 0.3s; margin-top: 10px;
}
.copy-btn:hover { background: var(--secondary); color: #000; }
.toast-container { position: fixed; bottom: 20px; left: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
.toast {
    background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--card-border);
    padding: 12px 20px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    transform: translateX(-120%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.toast.show { transform: translateX(0); }
.back-to-top {
    position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px; border-radius: 50%;
    background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text);
    display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 100;
    opacity: 0; pointer-events: none; transition: all 0.3s; backdrop-filter: blur(5px);
}
.back-to-top.visible { opacity: 1; pointer-events: auto; }
.back-to-top:hover { background: var(--primary); border-color: var(--primary); transform: translateY(-5px); }
.footer {
    border-top: 1px solid var(--card-border);
    padding: 60px 20px;
    background: linear-gradient(to bottom, transparent, rgba(139,92,246,0.03));
    margin-top: 40px;
}
.footer-content {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 40px;
}
.footer-brand p {
    color: var(--text-muted);
    margin-top: 10px;
    font-size: 0.95rem;
}
.footer-socials {
    display: flex;
    flex-direction: column;
    gap: 15px;
}
.social-title {
    color: var(--text);
    font-weight: 600;
    font-size: 1.1rem;
    margin-bottom: 5px;
}
.social-links {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}
.social-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 30px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.social-link:hover {
    transform: translateY(-5px) scale(1.05);
    color: #fff;
}
.social-link.instagram:hover { border-color: #e1306c; box-shadow: 0 5px 15px rgba(225, 48, 108, 0.3); background: rgba(225, 48, 108, 0.1); }
.social-link.telegram:hover { border-color: #0088cc; box-shadow: 0 5px 15px rgba(0, 136, 204, 0.3); background: rgba(0, 136, 204, 0.1); }
.social-link.discord:hover { border-color: #5865F2; box-shadow: 0 5px 15px rgba(88, 101, 242, 0.3); background: rgba(88, 101, 242, 0.1); }
.social-link.github:hover, .social-link.github-star:hover { border-color: #fff; box-shadow: 0 5px 15px rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.1); }
.social-link.github-star { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.2); color: #fff; }
.social-link.github-star svg { fill: #eab308; stroke: #eab308; }
.social-link svg {
    transition: transform 0.3s;
}
.social-link:hover svg {
    transform: scale(1.2) rotate(5deg);
}
@media (max-width: 768px) {
    .footer-content { flex-direction: column; text-align: center; justify-content: center; }
    .social-links { justify-content: center; }
}
.pomodoro-circle { width: 200px; height: 200px; border-radius: 50%; border: 8px solid var(--card-border); display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; font-size: 3rem; font-weight: 700; position: relative; transition: all 0.3s; }
.pomodoro-circle.active { border-color: var(--primary); box-shadow: 0 0 30px rgba(139,92,246,0.3); }
.color-preview { width: 100%; height: 100px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--card-border); transition: background 0.3s; }
.flex-row { display: flex; gap: 10px; }
.flex-row > * { flex: 1; }
.no-results { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted); font-size: 1.2rem; }
</style>
</head>
